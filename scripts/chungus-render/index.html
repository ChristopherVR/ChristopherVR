<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildChungus } from './chungus-model.js';

const W = 420, H = 480;
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x3a3326, 0.7));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(3, 7, 5); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 6, bottom: -2 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.22 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const c = buildChungus();
scene.add(c.root);
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
camera.position.set(0, 2.6, 12.5);
camera.lookAt(0, 2.3, 0);

const ARM_REST = new THREE.Quaternion().setFromEuler(new THREE.Euler(-1.3, 0, -0.62));
const ARM_UP = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, -1, 0), new THREE.Vector3(-0.15, 0.05, 1).normalize());
const WRIST = { x: -1.2, y: -0.9 };
const HANDS = {
	fist: { fingers: [[1.5, 1.4, 0.9], [1.5, 1.4, 0.9], [1.5, 1.4, 0.9], [1.5, 1.4, 0.9]], thumb: [0.9, 0, 0.9, 0.6] },
	ready: { fingers: [[0.3, 0.25, 0.1], [1.0, 1.0, 0.5], [1.55, 1.45, 0.9], [1.55, 1.45, 0.9]], thumb: [0.5, 0, 0.7, 1] },
	press: { fingers: [[0.3, 0.25, 0.1], [1.1, 1.05, 0.6], [1.55, 1.45, 0.9], [1.55, 1.45, 0.9]], thumb: [0.6, 0, 0.78, 1.05] },
	snapped: { fingers: [[0.2, 0.15, 0.05], [1.65, 1.55, 1.0], [1.55, 1.45, 0.9], [1.55, 1.45, 0.9]], thumb: [0.15, 0, 0.2, 0.1] },
};
const lerp = THREE.MathUtils.lerp;
function hand(a, b, t) {
	const A = HANDS[a], B = HANDS[b];
	c.gauntlet.fingers.forEach((js, i) => js.forEach((j, k) => (j.rotation.x = lerp(A.fingers[i][k], B.fingers[i][k], t))));
	const [base, tip] = c.gauntlet.thumb;
	base.rotation.set(lerp(A.thumb[0], B.thumb[0], t), lerp(A.thumb[1], B.thumb[1], t), lerp(A.thumb[2], B.thumb[2], t));
	tip.rotation.x = lerp(A.thumb[3], B.thumb[3], t);
}

/** Pose and render one frame; returns a data URL. */
window.frame = ({ turn = 0, walk = null, arm = 0, handFrom = 'fist', handTo = 'fist', handT = 1, glow = 0, flick = 0, scale = 1.85 }) => {
	c.root.rotation.y = (-Math.PI / 2) * (1 - turn);
	if (walk === null) {
		c.figure.rotation.z = 0; c.figure.position.y = 0;
		for (const f of c.feet) f.position.y = 0.13;
	} else {
		c.figure.rotation.z = Math.sin(walk) * 0.07;
		c.figure.position.y = Math.abs(Math.sin(walk)) * 0.14;
		c.feet[0].position.y = 0.13 + Math.max(0, Math.sin(walk)) * 0.22;
		c.feet[1].position.y = 0.13 + Math.max(0, -Math.sin(walk)) * 0.22;
	}
	c.arm.pivot.quaternion.slerpQuaternions(ARM_REST, ARM_UP, arm);
	c.arm.wrist.rotation.set(WRIST.x * arm + flick, WRIST.y * arm, 0);
	c.gauntlet.hand.scale.setScalar(scale);
	hand(handFrom, handTo, handT);
	for (const s of c.gauntlet.stones) s.emissiveIntensity = 0.25 + glow;
	c.gauntlet.glow.intensity = glow * 4;
	renderer.render(scene, camera);
	return renderer.domElement.toDataURL('image/webp', 0.82);
};
window.ready = true;
</script></body></html>
