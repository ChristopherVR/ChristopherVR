name: Profile graphics

# Rebuilds every drawing on the profile from live GitHub data and publishes
# them to the `output` branch. The build is plain Node with nothing to
# install and calls no image service, so the profile cannot break when
# someone else's server goes away.
#
# It runs:
#   - every hour, which is what keeps the sky in the hero close to the real
#     one over Brisbane and the "this week" numbers current
#   - when the scripts, fonts or README change
#   - by hand, from the Actions tab
#   - when another repository asks, so a project can refresh the profile the
#     moment it ships. Add this step to a project's release workflow, with a
#     token that can write to this repository stored as PROFILE_TOKEN:
#
#       - run: gh api repos/ChristopherVR/ChristopherVR/dispatches -f event_type=profile-refresh
#         env:
#           GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [profile-refresh]
  push:
    branches: [main]
    paths:
      - scripts/**
      - assets/**
      - README.md
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the profile graphics
        run: node scripts/build.mjs "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The project cards follow whatever is pinned on the profile. When the
      # pins change, the build rewrites that part of the README; commit it.
      # A push made with GITHUB_TOKEN does not start another run.
      - name: Commit the README if the project list changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update project cards to match pinned repositories" README.md
            git push
          fi

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
