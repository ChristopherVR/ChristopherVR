<svg xmlns="http://www.w3.org/2000/svg" width="860" height="124" viewBox="0 0 860 124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>Other projects: AbioticEditor and DownUnderDiscordBot</title>
<style>@keyframes wipe{from{transform:none}to{transform:translateX(100%)}}
.wipe{transform-box:fill-box;animation:wipe 1.1s linear 8.65s forwards}
@keyframes dust{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.p{opacity:0;animation:dust 1.6s ease-out forwards}
@keyframes leave{to{opacity:0}}
.old{animation:leave .18s ease-in 10s forwards}
@keyframes settle{from{opacity:0;transform:translateX(var(--dx))}to{opacity:1;transform:none}}
.new{opacity:0;animation:settle .65s cubic-bezier(.2,.8,.2,1) 10.18s forwards}
@media (prefers-reduced-motion: reduce){.wipe,.p,.old,.new{animation:none}.p,.new{display:none}}</style>
